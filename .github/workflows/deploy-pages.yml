# ──────────────────────────────────────────────────────────────────────
#  정적 버전(docs/) 을 GitHub Pages 로 자동 배포한다.
#
#  · main 브랜치의 docs/ 가 바뀔 때마다 자동으로 다시 배포된다.
#  · configure-pages 의 enablement 옵션이 Pages 를 자동으로 켜 주므로
#    저장소 Settings 에서 따로 설정할 필요가 없다.
#  · 배포 주소: https://<계정>.github.io/IDEA_MECE/
#
#  ※ Pages 는 공개 저장소에서만 무료로 게시된다(GitHub Free 기준).
#    저장소를 다시 비공개로 바꾸면 게시된 사이트는 자동으로 내려간다.
# ──────────────────────────────────────────────────────────────────────
name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:        # 필요할 때 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 진행한다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (없으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: docs 폴더를 배포 대상으로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
